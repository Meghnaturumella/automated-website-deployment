# kind-config.yaml - Configures a single-node local Kubernetes cluster using kind
# It maps host port 8080 to containerPort 30080 (the Kubernetes NodePort).

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kind

nodes:
  - role: control-plane
    extraPortMappings:
      # Map localhost:8080 on Windows to NodePort 30080 inside kind
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
